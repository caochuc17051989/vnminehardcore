# ============================================================
# [GRAVE STRUCTURE] CẤU TRÚC MỘ / GRAVE STRUCTURE
# ============================================================
# [VI] Chọn kiểu mộ bằng mini-graves:
#      true  = dùng mộ mini (đầu mộ dưới đất, đuốc trên mặt đất, mặc định)
#      false = dùng mộ full (3x4 block mặt đất)
#      Cả hai cấu trúc đều đặt phần thân dọc theo trục Z, bia ở phía sau.
# [EN] Select the grave style with mini-graves:
#      true  = use the mini grave (head below ground, torch at ground level; default)
#      false = use the full grave (3x4 ground footprint)
#      dx/dz describe the horizontal footprint; dy is always vertical.
#      The full grave marker faces north toward the grave body.
mini-graves: true

# [VI] Block PLAYER_HEAD tự động nhận skin người chết.
# [EN] PLAYER_HEAD blocks automatically use the deceased player's skin.

# ------------------------------------------------------------
# MỘ FULL / FULL GRAVE
# ------------------------------------------------------------
full:
  dimensions:
    width: 3
    height: 4
    depth: 4

  blocks:
    # Thân mộ trên mặt đất: đất ở giữa, viền đá hai bên.
    - {dx: 1, dy: 0, dz: 0, material: DIRT}
    - {dx: 1, dy: 0, dz: 1, material: DIRT}
    - {dx: 1, dy: 0, dz: 1, material: DIRT}
    - {dx: 0, dy: 0, dz: 0, material: STONE_BRICK_SLAB}
    - {dx: 0, dy: 0, dz: 1, material: STONE_BRICK_SLAB}
    - {dx: 0, dy: 0, dz: 1, material: STONE_BRICK_SLAB}
    - {dx: 2, dy: 0, dz: 0, material: STONE_BRICK_SLAB}
    - {dx: 2, dy: 0, dz: 1, material: STONE_BRICK_SLAB}
    - {dx: 2, dy: 0, dz: 1, material: STONE_BRICK_SLAB}
    - {dx: 1, dy: 1, dz: 1, material: OXEYE_DAISY, data: flower}
    - {dx: 1, dy: 1, dz: 1, material: TORCH}

    # Bia đứng ở cuối thân mộ; block đỡ nằm sau đầu và được đặt trước PLAYER_WALL_HEAD.
    - {dx: 0, dy: 0, dz: 2, material: STONE_BRICK_WALL}
    - {dx: 1, dy: 0, dz: 2, material: STONE_BRICK_WALL}
    - {dx: 2, dy: 0, dz: 2, material: STONE_BRICK_WALL}
    - {dx: 0, dy: 1, dz: 2, material: STONE_BRICK_WALL}
    - {dx: 2, dy: 1, dz: 2, material: STONE_BRICK_WALL}
    - {dx: 0, dy: 2, dz: 2, material: STONE_BRICK_WALL}
    - {dx: 1, dy: 2, dz: 2, material: STONE_BRICK_WALL}
    - {dx: 2, dy: 2, dz: 2, material: STONE_BRICK_WALL}
    - {dx: 0, dy: 3, dz: 2, material: STONE_BRICK_SLAB}
    - {dx: 1, dy: 3, dz: 2, material: STONE_BRICK_SLAB}
    - {dx: 2, dy: 3, dz: 2, material: STONE_BRICK_SLAB}
    - {dx: 1, dy: 1, dz: 3, material: STONE_BRICKS}
    - {dx: 1, dy: 1, dz: 2, material: PLAYER_WALL_HEAD, data: player-head, facing: NORTH}

# ------------------------------------------------------------
# MỘ MINI / MINI GRAVE
# ------------------------------------------------------------
mini:
  dimensions:
    width: 1
    height: 2
    depth: 1

  blocks:
    # Đầu mộ nằm một block dưới mặt đất, với đuốc ngay phía trên.
    - {dx: 0, dy: -1, dz: 0, material: PLAYER_HEAD, data: player-head}
    - {dx: 0, dy: 0, dz: 0, material: TORCH}
