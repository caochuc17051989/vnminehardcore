# ============================================================
# [ENDERMAN BOSS] 👁️ ENDERMAN BOSS
# ============================================================
boss-id: enderman_boss
enabled: true
entity-type: ENDERMAN
display-name: "§5§lEnderman Boss"
hp: 180
damage-multiplier: 2.2
chance: 10
# [VI] Thời gian boss tồn tại mặc định sau khi xuất hiện (giây); 1200 = 20 phút.
# [EN] Default boss lifetime after spawning (seconds); 1200 = 20 minutes.
duration-seconds: 1200
warning-seconds: 45
activity-radius: 100 # Max horizontal distance from this boss's spawn location (blocks).

# HP tối đa theo từng level; level không khai báo sẽ dùng mức gần nhất thấp hơn.
# [VI] Giá trị được khai báo đến level 10; runtime giới hạn HP tối đa của boss ở 1024.
# [EN] HP values are provided through level 10; runtime caps boss HP at 1024.
# damage là sát thương cơ sở và tăng theo level; multiply cấu hình số lần/độ mạnh skill.
hp-by-level:
  1: 180
  2: 270
  3: 405
  4: 608
  5: 912
  6: 1368
  7: 2052
  8: 3078
  9: 4617
  10: 6926
# [VI] Khóa chung mỗi skill: enabled (true/false), damage (0-1024, tăng theo level),
#      multiply (0-40), cooldown-seconds (1-86400), radius (1-64 block),
#      velocity (0.2-4), spread (0-3.14 radian). Giá trị bên dưới là mặc định.
# [EN] Common skill keys: enabled (true/false), damage (0-1024, scales by level),
#      multiply (0-40), cooldown-seconds (1-86400), radius (1-64 blocks),
#      velocity (0.2-4), spread (0-3.14 radians). Values below are defaults.
skills:
  void-snatch:
    enabled: true
    damage: 8.0
    multiply: 1
    cooldown-seconds: 12
    radius: 4.0
    velocity: 1.0
    spread: 0.0
    # [VI] Khoảng cách teleport ra sau mục tiêu (block); mặc định 1.5; hợp lệ 0.5-4.
    # [EN] Teleport offset behind target (blocks); default 1.5; valid range 0.5-4.
    behind-distance: 1.5
  end-rift:
    enabled: true
    damage: 0.0
    multiply: 1
    cooldown-seconds: 20
    radius: 6.0
    velocity: 1.0
    spread: 0.0
    # [VI] Nửa chiều dài chữ thập (block); mặc định 6; hợp lệ 2-12.
    # [EN] Cross half-length (blocks); default 6; valid range 2-12.
    length: 6
    # [VI] Nửa bề rộng dải particle (block); mặc định 1; hợp lệ 0-2.
    # [EN] Hazard half-width (blocks); default 1; valid range 0-2.
    half-width: 1
    # [VI] Thời gian báo hiệu trước khi hất tung (tick); mặc định 30; hợp lệ 10-100.
    # [EN] Warning before launch (ticks); default 30; valid range 10-100.
    warning-ticks: 30

# [VI] Trait dùng khóa enabled; mặc định bật, chỉ nhận true hoặc false.
# [EN] Traits use enabled; on by default and accepts true or false.
traits:
  hydro-phobic-aura:
    enabled: true
    # [VI] Bán kính aura khi ở nước/mưa (block); mặc định 5; hợp lệ 1-12.
    # [EN] Aura radius while touching water/rain (blocks); default 5; valid range 1-12.
    radius: 5.0
    # [VI] Độ bền giáp bị ăn mòn mỗi lần; mặc định 1; hợp lệ 0-5.
    # [EN] Armor durability consumed per pulse; default 1; valid range 0-5.
    armor-damage: 1
    # [VI] Hồi aura (giây); mặc định 3; hợp lệ 1-30.
    # [EN] Aura cooldown (seconds); default 3; valid range 1-30.
    cooldown-seconds: 3

immunities:
  potion-effects:
    - SLOWNESS

drops:
  ENDER_PEARL:
    min-amount: 8
    max-amount: 20
    chance: 0.9
  DIAMOND:
    min-amount: 4
    max-amount: 8
    chance: 0.4
  IRON_INGOT:
    min-amount: 10
    max-amount: 18
    chance: 0.5
  EMERALD:
    min-amount: 8
    max-amount: 15
    chance: 0.5
  OBSIDIAN:
    min-amount: 5
    max-amount: 15
    chance: 0.6
  ENDER_CHEST:
    min-amount: 1
    max-amount: 1
    chance: 0.2
  ENCHANTED_BOOK:
    min-amount: 1
    max-amount: 1
    chance: 0.25
  CHORUS_FRUIT:
    min-amount: 5
    max-amount: 12
    chance: 0.4

# [VI] Loot quý theo level; level thiếu dùng mốc gần nhất thấp hơn. amount: 1-64, chance: 0.0-1.0.
# [EN] Rare drops by level; missing tiers inherit the nearest lower tier. amount: 1-64, chance: 0.0-1.0.
# [VI] enchantments áp dụng trực tiếp; book-enchantments lưu enchant để áp dụng lên vật phẩm.
# [EN] enchantments apply to the item; book-enchantments are stored for applying to another item.
# [VI] Mỗi cấp có một di vật riêng; số dòng enchant tăng đúng theo level (1-10).
#      Số lượng hợp lệ 1-64; chance 0-1; cấp enchant 1-255.
#      Lore gồm truyền thuyết theo boss và tối đa 4 dòng cho mỗi vật phẩm.
#      Với cung, từ cấp 8 dùng sách phù phép để giữ đủ dòng enchant tương thích.
# [EN] Each tier has a unique relic; enchantment lines increase with level (1-10).
#      Valid amount 1-64, chance 0-1, and enchantment level 1-255.
#      Each item's lore tells the boss-specific legend in at most 4 lines.
#      Bow relics use enchanted books from tier 8 to preserve compatible enchantments.
