# ============================================================
# [GHAST] 👻 GHAST KHỔNG LỒ
# ============================================================
boss-id: ghast
enabled: true
entity-type: GHAST
display-name: "§e§lGhast Khổng Lồ"
hp: 100
damage-multiplier: 2.5
chance: 10
# [VI] Thời gian boss tồn tại mặc định sau khi xuất hiện (giây); 1200 = 20 phút.
# [EN] Default boss lifetime after spawning (seconds); 1200 = 20 minutes.
duration-seconds: 1200
warning-seconds: 45
activity-radius: 100 # Max horizontal distance from this boss's spawn location (blocks).

# HP tối đa theo từng level; level không khai báo sẽ dùng mức gần nhất thấp hơn.
# [VI] Giá trị được khai báo đến level 10; runtime giới hạn HP tối đa của boss ở 1024.
# [EN] HP values are provided through level 10; runtime caps boss HP at 1024.
# damage là sát thương cơ sở (tăng theo level); số cầu lửa = level * multiply, tối đa 40.
hp-by-level:
  1: 100
  2: 150
  3: 225
  4: 338
  5: 507
  6: 760
  7: 1140
  8: 1710
  9: 2565
  10: 3848
# [VI] Khóa chung mỗi skill: enabled (true/false), damage (0-1024, tăng theo level),
#      multiply (0-40), cooldown-seconds (1-86400), radius (1-64 block),
#      velocity (0.2-4), spread (0-3.14 radian). Giá trị bên dưới là mặc định.
# [EN] Common skill keys: enabled (true/false), damage (0-1024, scales by level),
#      multiply (0-40), cooldown-seconds (1-86400), radius (1-64 blocks),
#      velocity (0.2-4), spread (0-3.14 radians). Values below are defaults.
skills:
  fireball-volley:
    enabled: true
    damage: 8.0
    multiply: 3
    cooldown-seconds: 12
    radius: 5.0
    velocity: 1.2
    spread: 1.3
    # [VI] Số cầu lửa nhỏ sau khi tách; mặc định 6; hợp lệ 5-8.
    # [EN] Small fireballs after split; default 6; valid range 5-8.
    split-count: 6
    # [VI] Tốc độ cầu lửa nhỏ; mặc định 1.2; hợp lệ 0.4-3.
    # [EN] Split fireball speed; default 1.2; valid range 0.4-3.
    split-velocity: 1.2
    # [VI] Góc tỏa giữa các cầu lửa (radian); mặc định 0.3; hợp lệ 0.05-1.
    # [EN] Fan angle between split fireballs (radians); default 0.3; valid range 0.05-1.
    split-spread: 0.3
  fiery-drag:
    enabled: true
    damage: 0.0
    multiply: 1
    cooldown-seconds: 20
    radius: 10.0
    velocity: 0.8
    spread: 0.0
    # [VI] Lực kéo về Ghast; mặc định 0.8; hợp lệ 0.2-1.5.
    # [EN] Pull strength toward Ghast; default 0.8; valid range 0.2-1.5.
    pull-speed: 0.8
    # [VI] Cho phép tạo block tạm dưới người chơi; mặc định bật; true/false.
    # [EN] Place temporary floor hazards; enabled by default; true/false.
    terrain-enabled: true
    # [VI] Vật liệu nguy hiểm; mặc định MAGMA_BLOCK; hỗ trợ MAGMA_BLOCK hoặc FIRE.
    # [EN] Hazard material; default MAGMA_BLOCK; supported values: MAGMA_BLOCK or FIRE.
    terrain-material: MAGMA_BLOCK
    # [VI] Thời gian block nguy hiểm tồn tại (giây); mặc định 5; hợp lệ 1-30.
    # [EN] Hazard lifetime (seconds); default 5; valid range 1-30.
    terrain-duration-seconds: 5
    # [VI] Danh sách block mặt đất được thay bằng Magma; để trống dùng whitelist an toàn mặc định.
    # [EN] Ground blocks replaceable by magma; empty uses the safe built-in allowlist.
    replaceable-blocks: []

# [VI] Trait dùng khóa enabled; mặc định bật, chỉ nhận true hoặc false.
# [EN] Traits use enabled; on by default and accepts true or false.
traits:
  fireball-shield:
    enabled: true

immunities:
  fire: true
  sunlight-burn: true
  fall-damage: true

drops:
  GHAST_TEAR:
    min-amount: 3
    max-amount: 8
    chance: 0.8
  MAGMA_CREAM:
    min-amount: 3
    max-amount: 6
    chance: 0.7
  DIAMOND:
    min-amount: 3
    max-amount: 6
    chance: 0.4
  IRON_INGOT:
    min-amount: 8
    max-amount: 15
    chance: 0.5
