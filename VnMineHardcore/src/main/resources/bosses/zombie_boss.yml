# ============================================================
# [ZOMBIE BOSS] 🧟 ZOMBIE BOSS
# ============================================================
boss-id: zombie_boss
enabled: true
entity-type: ZOMBIE
display-name: "§2§lZombie Boss"
hp: 150
damage-multiplier: 1.5
chance: 15
# [VI] Thời gian boss tồn tại mặc định sau khi xuất hiện (giây); 1200 = 20 phút.
# [EN] Default boss lifetime after spawning (seconds); 1200 = 20 minutes.
duration-seconds: 1200
warning-seconds: 45
activity-radius: 100 # Max horizontal distance from this boss's spawn location (blocks).

# HP tối đa theo từng level; level không khai báo sẽ dùng mức gần nhất thấp hơn.
# [VI] Giá trị được khai báo đến level 10; runtime giới hạn HP tối đa của boss ở 1024.
# [EN] HP values are provided through level 10; runtime caps boss HP at 1024.
# damage là sát thương cơ sở và tăng theo level; multiply cấu hình số lần/độ mạnh skill.
hp-by-level:
  1: 150
  2: 225
  3: 338
  4: 507
  5: 760
  6: 1140
  7: 1710
  8: 2565
  9: 3848
  10: 5772
skills:
  ground-slam:
    enabled: true
    damage: 7.0
    multiply: 1
    cooldown-seconds: 10
    radius: 5.0
    velocity: 1.1
    spread: 0.0

immunities:
  sunlight-burn: true
  potion-effects:
    - SLOWNESS

drops:
  ROTTEN_FLESH:
    min-amount: 10
    max-amount: 25
    chance: 0.9
  IRON_INGOT:
    min-amount: 10
    max-amount: 20
    chance: 0.7
  DIAMOND:
    min-amount: 3
    max-amount: 7
    chance: 0.35
  EMERALD:
    min-amount: 8
    max-amount: 15
    chance: 0.5
  GOLD_INGOT:
    min-amount: 5
    max-amount: 12
    chance: 0.5
  CARROT:
    min-amount: 5
    max-amount: 10
    chance: 0.4
  POTATO:
    min-amount: 5
    max-amount: 10
    chance: 0.4
  ENCHANTED_BOOK:
    min-amount: 1
    max-amount: 1
    chance: 0.2
  IRON_SWORD:
    min-amount: 1
    max-amount: 1
    chance: 0.3
  IRON_HELMET:
    min-amount: 1
    max-amount: 1
    chance: 0.25

# [VI] Loot quý theo level; nếu level cao hơn cấu hình sẽ dùng mốc gần nhất thấp hơn.
# [EN] Rare drops by level; higher levels inherit the nearest lower configured tier.
# [VI] amount hợp lệ 1-64, chance 0.0-1.0; enchantments áp dụng trực tiếp, book-enchantments lưu trong sách.
# [EN] amount range is 1-64, chance is 0.0-1.0; enchantments apply directly, book-enchantments are stored in books.
# [VI] Mỗi cấp có một di vật riêng; số dòng enchant tăng đúng theo level (1-10).
#      Số lượng hợp lệ 1-64; chance 0-1; cấp enchant 1-255.
#      Lore gồm truyền thuyết theo boss và tối đa 4 dòng cho mỗi vật phẩm.
#      Với cung, từ cấp 8 dùng sách phù phép để giữ đủ dòng enchant tương thích.
# [EN] Each tier has a unique relic; enchantment lines increase with level (1-10).
#      Valid amount 1-64, chance 0-1, and enchantment level 1-255.
#      Each item's lore tells the boss-specific legend in at most 4 lines.
#      Bow relics use enchanted books from tier 8 to preserve compatible enchantments.
