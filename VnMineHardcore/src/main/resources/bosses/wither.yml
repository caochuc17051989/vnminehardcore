# ============================================================
# [WITHER] ☠ WITHER HUYỀN THOẠI
# ============================================================
# [VI] Wither Huyền Thoại - Boss mạnh nhất trong số các boss
# [EN] Legendary Wither - The strongest among all bosses

boss-id: wither
enabled: true
entity-type: WITHER
display-name: "§e☠ §c§lWither Huyền Thoại §e☠"
hp: 600
damage-multiplier: 2.0
chance: 10
# [VI] Thời gian boss tồn tại mặc định sau khi xuất hiện (giây); 1200 = 20 phút.
# [EN] Default boss lifetime after spawning (seconds); 1200 = 20 minutes.
duration-seconds: 1200
warning-seconds: 60
activity-radius: 100 # Max horizontal distance from this boss's spawn location (blocks).

# HP tối đa theo từng level; level không khai báo sẽ dùng mức gần nhất thấp hơn.
# [VI] Giá trị được khai báo đến level 10; runtime giới hạn HP tối đa của boss ở 1024.
# [EN] HP values are provided through level 10; runtime caps boss HP at 1024.
# damage là sát thương cơ sở (tăng theo level); số skull = level * multiply, tối đa 40.
hp-by-level:
  1: 600
  2: 900
  3: 1350
  4: 2025
  5: 3038
  6: 4557
  7: 6836
  8: 10254
  9: 15381
  10: 23072
skills:
  skull-volley:
    enabled: true
    damage: 9.0
    multiply: 3
    cooldown-seconds: 12
    radius: 6.0
    velocity: 1.2
    spread: 1.0

# ===== MIỄN NHIỄM / IMMUNITIES =====
# [VI] Các hiệu ứng boss này miễn nhiễm
# [EN] Effects this boss is immune to
immunities:
  fire: true
  poison: true
  wither: true
  sunlight-burn: true
  fall-damage: true
  potion-effects:
    - SLOWNESS
    - WEAKNESS

