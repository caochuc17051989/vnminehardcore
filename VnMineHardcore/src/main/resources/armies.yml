    materials:
      EMERALD: 12
  # [VI] Chi phí lính cấp 3.
  # [EN] Tier 3 hiring costs.
  3:
    # [VI] XP level; mặc định 16, hợp lệ 0-100000.
    # [EN] XP levels; default 16, valid range 0-100000.
    experience-levels: 16
    # [VI] Chi phí mặc định 16 Emerald; số lượng mỗi vật liệu hợp lệ 0-1000000.
    # [EN] Default cost 16 Emeralds; each material amount must be 0-1000000.
    materials:
      EMERALD: 16
  # [VI] Chi phí lính cấp 4.
  # [EN] Tier 4 hiring costs.
  4:
    # [VI] XP level; mặc định 20, hợp lệ 0-100000.
    # [EN] XP levels; default 20, valid range 0-100000.
    experience-levels: 20
    # [VI] Chi phí mặc định 20 Emerald; số lượng mỗi vật liệu hợp lệ 0-1000000.
    # [EN] Default cost 20 Emeralds; each material amount must be 0-1000000.
    materials:
      EMERALD: 20
  # [VI] Chi phí lính cấp 5.
  # [EN] Tier 5 hiring costs.
  5:
    # [VI] XP level; mặc định 24, hợp lệ 0-100000.
    # [EN] XP levels; default 24, valid range 0-100000.
    experience-levels: 24
    # [VI] Chi phí mặc định 24 Emerald; số lượng mỗi vật liệu hợp lệ 0-1000000.
    # [EN] Default cost 24 Emeralds; each material amount must be 0-1000000.
    materials:
      EMERALD: 24
  # [VI] Chi phí lính cấp 6.
  # [EN] Tier 6 hiring costs.
  6:
    # [VI] XP level; mặc định 28, hợp lệ 0-100000.
    # [EN] XP levels; default 28, valid range 0-100000.
    experience-levels: 28
    # [VI] Chi phí mặc định 28 Emerald; số lượng mỗi vật liệu hợp lệ 0-1000000.
    # [EN] Default cost 28 Emeralds; each material amount must be 0-1000000.
    materials:
      EMERALD: 28
  # [VI] Chi phí lính cấp 7.
  # [EN] Tier 7 hiring costs.
  7:
    # [VI] XP level; mặc định 32, hợp lệ 0-100000.
    # [EN] XP levels; default 32, valid range 0-100000.
    experience-levels: 32
    # [VI] Chi phí mặc định 32 Emerald; số lượng mỗi vật liệu hợp lệ 0-1000000.
    # [EN] Default cost 32 Emeralds; each material amount must be 0-1000000.
    materials:
      EMERALD: 32
  # [VI] Chi phí lính cấp 8.
  # [EN] Tier 8 hiring costs.
  8:
    # [VI] XP level; mặc định 36, hợp lệ 0-100000.
    # [EN] XP levels; default 36, valid range 0-100000.
    experience-levels: 36
    # [VI] Chi phí mặc định 36 Emerald; số lượng mỗi vật liệu hợp lệ 0-1000000.
    # [EN] Default cost 36 Emeralds; each material amount must be 0-1000000.
    materials:
      EMERALD: 36
  # [VI] Chi phí lính cấp 9.
  # [EN] Tier 9 hiring costs.
  9:
    # [VI] XP level; mặc định 40, hợp lệ 0-100000.
    # [EN] XP levels; default 40, valid range 0-100000.
    experience-levels: 40
    # [VI] Chi phí mặc định 40 Emerald; số lượng mỗi vật liệu hợp lệ 0-1000000.
    # [EN] Default cost 40 Emeralds; each material amount must be 0-1000000.
    materials:
      EMERALD: 40
  # [VI] Chi phí lính cấp 10.
  # [EN] Tier 10 hiring costs.
  10:
    # [VI] XP level; mặc định 44, hợp lệ 0-100000.
    # [EN] XP levels; default 44, valid range 0-100000.
    experience-levels: 44
    # [VI] Chi phí mặc định 44 Emerald; số lượng mỗi vật liệu hợp lệ 0-1000000.
