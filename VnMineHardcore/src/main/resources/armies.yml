# [VI] Cấu hình lính đánh thuê; có thể chỉnh mà không cần biên dịch lại.
# [EN] Mercenary settings; editable without recompiling the plugin.

# [VI] Bật hệ thống; mặc định true, chỉ nhận true/false.
# [EN] Enable the system; default true, accepts true/false.
enabled: true

# [VI] Số lính tối đa mỗi chủ; mặc định 4, hợp lệ 1-100.
# [EN] Maximum units per owner; default 4, valid range 1-100.
max-units-per-player: 4

# [VI] Khoảng cách theo chủ; mặc định 8 block, hợp lệ 2-64.
# [EN] Follow distance; default 8 blocks, valid range 2-64.
follow-distance-blocks: 8.0

# [VI] Ngưỡng dịch chuyển về chủ; mặc định 40 block, hợp lệ 8-256.
# [EN] Teleport-to-owner threshold; default 40 blocks, valid range 8-256.
teleport-distance-blocks: 40.0

# [VI] Bán kính tìm mục tiêu; mặc định 20 block, hợp lệ 4-64.
# [EN] Target search radius; default 20 blocks, valid range 4-64.
target-radius-blocks: 20.0

# [VI] Chu kỳ cập nhật AI; mặc định 20 tick, hợp lệ 10-100.
# [EN] AI update interval; default 20 ticks, valid range 10-100.
ai-interval-ticks: 20

# [VI] Tiến trình level farm riêng biệt với tier triệu hồi; mặc định 5 XP mỗi mạng, 100 XP mỗi level, tối đa level 50.
# [EN] Farming progression is separate from summon tier; defaults to 5 XP per kill, 100 XP per level, maximum level 50.
progression:
  # [VI] XP lính nhận khi hạ quái; mặc định 5, hợp lệ 0-100000.
  # [EN] XP awarded to a mercenary per mob kill; default 5, valid range 0-100000.
  experience-per-kill: 5
  # [VI] XP cơ bản cần cho level tiếp theo; yêu cầu tăng theo level hiện tại; mặc định 100, hợp lệ 1-100000.
  # [EN] Base XP required for the next level; requirement scales with current level; default 100, valid range 1-100000.
  experience-per-level: 100
  # [VI] Level farm tối đa; mặc định 50, hợp lệ 1-1000.
  # [EN] Maximum farming level; default 50, valid range 1-1000.
  max-level: 50

# [VI] Giá trị mặc định cho kỹ năng hỗ trợ; giới hạn được ghi tại từng khóa.
# [EN] Support skill defaults; limits are documented for each key.
skills:
  # [VI] Hồi riêng từng kỹ năng; mặc định 15 giây, hợp lệ 1-3600.
  # [EN] Per-skill cooldown; default 15 seconds, valid range 1-3600.
  cooldown-seconds: 15
  # [VI] Máu hồi mỗi lần; mặc định 4, hợp lệ 0-100.
  # [EN] Health restored per use; default 4, valid range 0-100.
  heal-amount: 4.0
  # [VI] Bán kính hồi đồng minh; mặc định 8 block, hợp lệ 1-32.
  # [EN] Ally healing radius; default 8 blocks, valid range 1-32.
  heal-radius-blocks: 8.0
  # [VI] Hiệu ứng buff; mặc định SPEED, phải là hiệu ứng hợp lệ.
  # [EN] Owner buff; default SPEED, must be a valid effect.
  owner-buff: SPEED
  # [VI] Thời lượng buff; mặc định 8 giây, hợp lệ 1-600.
  # [EN] Buff duration; default 8 seconds, valid range 1-600.
  owner-buff-seconds: 8
  # [VI] Tỉ lệ giảm sát thương cho chủ khi SHIELD_OWNER kích hoạt; mặc định 20%, hợp lệ 0-0.9.
  # [EN] Owner damage reduction when SHIELD_OWNER triggers; default 20%, valid range 0-0.9.
  owner-damage-reduction: 0.2

# [VI] Các lớp lính; entity-type phải là mob có Bukkit AI.
# [EN] Mercenary classes; entity-type must be a Bukkit AI mob.
classes:
  archer:
    # [VI] Tên hiển thị; mặc định Xạ Thủ.
    # [EN] Display name; default Archer.
    display-name: "Xạ Thủ"
    # [VI] Mô tả chức năng hiện trong GUI.
    # [EN] Short role description shown in the GUI.
    description: "Tấn công mục tiêu từ xa bằng cung tên."
    # [VI] Entity; mặc định SKELETON.
    # [EN] Entity type; default SKELETON.
    entity-type: SKELETON
    # [VI] Máu cấp 1; mặc định 20, phải lớn hơn 0.
    # [EN] Level-1 health; default 20, must be positive.
    base-health: 20
    # [VI] Máu thêm mỗi cấp; mặc định 3, phải không âm.
    # [EN] Health per level; default 3, must be nonnegative.
    health-per-level: 3
    # [VI] Sát thương cơ bản; mặc định 4, phải không âm.
    # [EN] Base damage; default 4, must be nonnegative.
    base-damage: 4
    # [VI] Giáp cấp đầu tiên; mặc định 0, hợp lệ 0-100.
    # [EN] Base armor at the initial rank; default 0, valid range 0-100.
    base-armor: 0
    # [VI] Giáp tăng mỗi bậc tổng hợp; mặc định 0, hợp lệ 0-100.
    # [EN] Armor gained per combined rank; default 0, valid range 0-100.
    armor-per-level: 0
    # [VI] Sát thương thêm mỗi cấp; mặc định 0.5, phải không âm.
    # [EN] Damage per level; default 0.5, must be nonnegative.
    damage-per-level: 0.5
    # [VI] Biểu tượng trong GUI; mặc định BOW, phải là Material Bukkit hợp lệ.
    # [EN] GUI icon; default BOW, must be a valid Bukkit Material.
    menu-icon: BOW
    # [VI] Skill Xạ Thủ; có thể bật/tắt bằng cách thêm/xóa ID skill.
    # [EN] Archer skills; enable/disable skills by adding/removing skill IDs.
    # [VI] Hợp lệ: ATTACK, RANGED_ATTACK, HEAL_OWNER, HEAL_ALLIES, BUFF_OWNER, BUFF_ALLIES, SHIELD_OWNER.
    # [EN] Valid: ATTACK, RANGED_ATTACK, HEAL_OWNER, HEAL_ALLIES, BUFF_OWNER, BUFF_ALLIES, SHIELD_OWNER.
    skills: [RANGED_ATTACK]
    # [VI] Tầm tìm mục tiêu; mặc định 24 block, hợp lệ 4-64.
    # [EN] Target acquisition range; default 24 blocks, valid range 4-64.
    target-radius-blocks: 24.0
    # [VI] Tùy chỉnh riêng skill; cooldown giây 1-3600, sát thương 0-100.
    # [EN] Per-skill tuning; cooldown seconds 1-3600, damage 0-100.
    skill-settings:
      RANGED_ATTACK:
        # [VI] Thời gian giữa các phát tên; mặc định 2 giây, hợp lệ 1-3600.
        # [EN] Delay between arrows; default 2 seconds, valid range 1-3600.
        cooldown-seconds: 2
        # [VI] Sát thương tên; mặc định 6, hợp lệ 0-100.
        # [EN] Arrow damage; default 6, valid range 0-100.
        damage: 6.0
        # [VI] Tầm giữ vị trí bắn; mặc định 16 block, hợp lệ 4-64.
        # [EN] Preferred firing distance; default 16 blocks, valid range 4-64.
        range-blocks: 16.0
  guardian:
    # [VI] Tên hiển thị; mặc định Vệ Binh.
    # [EN] Display name; default Guardian.
    display-name: "Vệ Binh"
    # [VI] Mô tả chức năng hiện trong GUI.
    # [EN] Short role description shown in the GUI.
    description: "Chiến đấu cận chiến và bảo vệ chủ nhân."
    # [VI] Entity; mặc định VINDICATOR.
    # [EN] Entity type; default VINDICATOR.
    entity-type: VINDICATOR
    # [VI] Máu cấp 1; mặc định 32, phải lớn hơn 0.
    # [EN] Level-1 health; default 32, must be positive.
    base-health: 32
    # [VI] Máu thêm mỗi cấp; mặc định 5, phải không âm.
    # [EN] Health per level; default 5, must be nonnegative.
    health-per-level: 5
    # [VI] Sát thương cơ bản; mặc định 7, phải không âm.
    # [EN] Base damage; default 7, must be nonnegative.
    base-damage: 7
    # [VI] Giáp cấp đầu tiên; mặc định 0, hợp lệ 0-100.
    # [EN] Base armor at the initial rank; default 0, valid range 0-100.
    base-armor: 0
    # [VI] Giáp tăng mỗi bậc tổng hợp; mặc định 0, hợp lệ 0-100.
    # [EN] Armor gained per combined rank; default 0, valid range 0-100.
    armor-per-level: 0
    # [VI] Sát thương thêm mỗi cấp; mặc định 0.75, phải không âm.
    # [EN] Damage per level; default 0.75, must be nonnegative.
    damage-per-level: 0.75
    # [VI] Biểu tượng trong GUI; mặc định SHIELD, phải là Material Bukkit hợp lệ.
    # [EN] GUI icon; default SHIELD, must be a valid Bukkit Material.
    menu-icon: SHIELD
    # [VI] Skill Vệ Binh; danh sách ID hợp lệ giống mô tả của Xạ Thủ.
    # [EN] Guardian skills; valid IDs are listed in the Archer description.
    skills: [ATTACK, SHIELD_OWNER]
    # [VI] Tầm tìm mục tiêu; mặc định 20 block, hợp lệ 4-64.
    # [EN] Target acquisition range; default 20 blocks, valid range 4-64.
    target-radius-blocks: 20.0
    # [VI] Tùy chỉnh khiên; cooldown giây 1-3600, tầm 1-32 block, giảm sát thương 0-0.9.
    # [EN] Shield tuning; cooldown seconds 1-3600, range 1-32 blocks, damage reduction 0-0.9.
    skill-settings:
      SHIELD_OWNER:
        # [VI] Thời gian hồi; mặc định 8 giây, hợp lệ 1-3600.
        # [EN] Cooldown; default 8 seconds, valid range 1-3600.
        cooldown-seconds: 8
        # [VI] Khoảng cách bảo vệ chủ; mặc định 8 block, hợp lệ 1-32.
        # [EN] Owner protection radius; default 8 blocks, valid range 1-32.
        radius-blocks: 8.0
        # [VI] Phần sát thương bị giảm; mặc định 0.3, hợp lệ 0-0.9.
        # [EN] Fraction of damage reduced; default 0.3, valid range 0-0.9.
        damage-reduction: 0.3
  medic:
    # [VI] Tên hiển thị; mặc định Y Sư.
    # [EN] Display name; default Medic.
    display-name: "Y Sư"
    # [VI] Mô tả chức năng hiện trong GUI.
    # [EN] Short role description shown in the GUI.
    description: "Hồi máu và tăng hiệu ứng cho chủ nhân, đồng minh."
    # [VI] Entity; mặc định VILLAGER.
    # [EN] Entity type; default VILLAGER.
    entity-type: VILLAGER
    # [VI] Máu cấp 1; mặc định 24, phải lớn hơn 0.
    # [EN] Level-1 health; default 24, must be positive.
    base-health: 24
    # [VI] Máu thêm mỗi cấp; mặc định 3, phải không âm.
    # [EN] Health per level; default 3, must be nonnegative.
    health-per-level: 3
    # [VI] Sát thương cơ bản; mặc định 0, phải không âm.
    # [EN] Base damage; default 0, must be nonnegative.
    base-damage: 0
    # [VI] Giáp cấp đầu tiên; mặc định 0, hợp lệ 0-100.
    # [EN] Base armor at the initial rank; default 0, valid range 0-100.
    base-armor: 0
    # [VI] Giáp tăng mỗi bậc tổng hợp; mặc định 0, hợp lệ 0-100.
    # [EN] Armor gained per combined rank; default 0, valid range 0-100.
    armor-per-level: 0
    # [VI] Sát thương thêm mỗi cấp; mặc định 0, phải không âm.
    # [EN] Damage per level; default 0, must be nonnegative.
    damage-per-level: 0
    # [VI] Biểu tượng trong GUI; mặc định GOLDEN_APPLE.
    # [EN] GUI icon; default GOLDEN_APPLE.
    menu-icon: GOLDEN_APPLE
    # [VI] Skill Y Sư; mục tiêu hỗ trợ: OWNER, ALLIES hoặc OWNER_AND_ALLIES.
    # [EN] Medic skills; support targets: OWNER, ALLIES, or OWNER_AND_ALLIES.
    skills: [HEAL_OWNER, HEAL_ALLIES, BUFF_OWNER, BUFF_ALLIES]
    # [VI] Tùy chỉnh hồi/buff; mọi cooldown tính bằng giây, hợp lệ 1-3600.
    # [EN] Heal/buff tuning; cooldowns are seconds, valid range 1-3600.
    skill-settings:
      HEAL_OWNER:
        # [VI] Thời gian hồi; mặc định 10 giây, hợp lệ 1-3600.
        # [EN] Cooldown; default 10 seconds, valid range 1-3600.
        cooldown-seconds: 10
        # [VI] Máu hồi; mặc định 6, hợp lệ 0-100.
        # [EN] Health restored; default 6, valid range 0-100.
        amount: 6.0
      HEAL_ALLIES:
        # [VI] Thời gian hồi; mặc định 12 giây, hợp lệ 1-3600.
        # [EN] Cooldown; default 12 seconds, valid range 1-3600.
        cooldown-seconds: 12
        # [VI] Mục tiêu hồi máu; mặc định OWNER_AND_ALLIES.
        # [EN] Healing targets; default OWNER_AND_ALLIES.
        target: OWNER_AND_ALLIES
        # [VI] Máu hồi; mặc định 5, hợp lệ 0-100.
        # [EN] Health restored; default 5, valid range 0-100.
        amount: 5.0
        # [VI] Bán kính hồi; mặc định 8 block, hợp lệ 1-32.
        # [EN] Healing radius; default 8 blocks, valid range 1-32.
        radius-blocks: 8.0
      BUFF_OWNER:
        # [VI] Thời gian hồi; mặc định 30 giây, hợp lệ 1-3600.
        # [EN] Cooldown; default 30 seconds, valid range 1-3600.
        cooldown-seconds: 30
        # [VI] Hiệu ứng hợp lệ trong Bukkit; mặc định REGENERATION.
        # [EN] Effect must be registered by Bukkit; default REGENERATION.
        effect: REGENERATION
        # [VI] Thời lượng; mặc định 5 giây, hợp lệ 1-600.
        # [EN] Duration; default 5 seconds, valid range 1-600.
        duration-seconds: 5
      BUFF_ALLIES:
        # [VI] Thời gian hồi; mặc định 45 giây, hợp lệ 1-3600.
        # [EN] Cooldown; default 45 seconds, valid range 1-3600.
        cooldown-seconds: 45
        # [VI] Mục tiêu buff; mặc định OWNER_AND_ALLIES.
        # [EN] Buff targets; default OWNER_AND_ALLIES.
        target: OWNER_AND_ALLIES
        # [VI] Hiệu ứng hợp lệ trong Bukkit; mặc định REGENERATION.
        # [EN] Effect must be registered by Bukkit; default REGENERATION.
        effect: REGENERATION
        # [VI] Thời lượng; mặc định 4 giây, hợp lệ 1-600.
        # [EN] Duration; default 4 seconds, valid range 1-600.
        duration-seconds: 4
        # [VI] Cấp hiệu ứng; mặc định 0, hợp lệ 0-10.
        # [EN] Potion amplifier; default 0, valid range 0-10.
        amplifier: 0
        # [VI] Bán kính buff; mặc định 8 block, hợp lệ 1-32.
        # [EN] Buff radius; default 8 blocks, valid range 1-32.
        radius-blocks: 8.0

# [VI] Chi phí và cấp lính; phải có token đúng lớp/cấp, XP/vật liệu chỉ trừ khi thuê thành công.
# [EN] Tier costs; an exact class/level token is required and XP/materials are charged only on success.
tiers:
  # [VI] Chi phí lính cấp 1.
  # [EN] Tier 1 hiring costs.
  1:
    # [VI] XP level; mặc định 8, hợp lệ 0-100000.
    # [EN] XP levels; default 8, valid range 0-100000.
    experience-levels: 8
    # [VI] Chi phí mặc định 8 Emerald; số lượng mỗi vật liệu hợp lệ 0-1000000.
    # [EN] Default cost 8 Emeralds; each material amount must be 0-1000000.
    materials:
      EMERALD: 8
  # [VI] Chi phí lính cấp 2.
  # [EN] Tier 2 hiring costs.
  2:
    # [VI] XP level; mặc định 12, hợp lệ 0-100000.
    # [EN] XP levels; default 12, valid range 0-100000.
    experience-levels: 12
    # [VI] Chi phí mặc định 12 Emerald; số lượng mỗi vật liệu hợp lệ 0-1000000.
    # [EN] Default cost 12 Emeralds; each material amount must be 0-1000000.
    materials:
      EMERALD: 12
  # [VI] Chi phí lính cấp 3.
  # [EN] Tier 3 hiring costs.
  3:
    # [VI] XP level; mặc định 16, hợp lệ 0-100000.
    # [EN] XP levels; default 16, valid range 0-100000.
    experience-levels: 16
    # [VI] Chi phí mặc định 16 Emerald; số lượng mỗi vật liệu hợp lệ 0-1000000.
    # [EN] Default cost 16 Emeralds; each material amount must be 0-1000000.
    materials:
      EMERALD: 16
  # [VI] Chi phí lính cấp 4.
  # [EN] Tier 4 hiring costs.
  4:
    # [VI] XP level; mặc định 20, hợp lệ 0-100000.
    # [EN] XP levels; default 20, valid range 0-100000.
    experience-levels: 20
    # [VI] Chi phí mặc định 20 Emerald; số lượng mỗi vật liệu hợp lệ 0-1000000.
    # [EN] Default cost 20 Emeralds; each material amount must be 0-1000000.
    materials:
      EMERALD: 20
  # [VI] Chi phí lính cấp 5.
  # [EN] Tier 5 hiring costs.
  5:
    # [VI] XP level; mặc định 24, hợp lệ 0-100000.
    # [EN] XP levels; default 24, valid range 0-100000.
    experience-levels: 24
    # [VI] Chi phí mặc định 24 Emerald; số lượng mỗi vật liệu hợp lệ 0-1000000.
    # [EN] Default cost 24 Emeralds; each material amount must be 0-1000000.
    materials:
      EMERALD: 24
  # [VI] Chi phí lính cấp 6.
  # [EN] Tier 6 hiring costs.
  6:
    # [VI] XP level; mặc định 28, hợp lệ 0-100000.
    # [EN] XP levels; default 28, valid range 0-100000.
    experience-levels: 28
    # [VI] Chi phí mặc định 28 Emerald; số lượng mỗi vật liệu hợp lệ 0-1000000.
    # [EN] Default cost 28 Emeralds; each material amount must be 0-1000000.
    materials:
      EMERALD: 28
  # [VI] Chi phí lính cấp 7.
  # [EN] Tier 7 hiring costs.
  7:
    # [VI] XP level; mặc định 32, hợp lệ 0-100000.
    # [EN] XP levels; default 32, valid range 0-100000.
    experience-levels: 32
    # [VI] Chi phí mặc định 32 Emerald; số lượng mỗi vật liệu hợp lệ 0-1000000.
    # [EN] Default cost 32 Emeralds; each material amount must be 0-1000000.
    materials:
      EMERALD: 32
  # [VI] Chi phí lính cấp 8.
  # [EN] Tier 8 hiring costs.
  8:
    # [VI] XP level; mặc định 36, hợp lệ 0-100000.
    # [EN] XP levels; default 36, valid range 0-100000.
    experience-levels: 36
    # [VI] Chi phí mặc định 36 Emerald; số lượng mỗi vật liệu hợp lệ 0-1000000.
    # [EN] Default cost 36 Emeralds; each material amount must be 0-1000000.
    materials:
      EMERALD: 36
  # [VI] Chi phí lính cấp 9.
  # [EN] Tier 9 hiring costs.
  9:
    # [VI] XP level; mặc định 40, hợp lệ 0-100000.
    # [EN] XP levels; default 40, valid range 0-100000.
    experience-levels: 40
    # [VI] Chi phí mặc định 40 Emerald; số lượng mỗi vật liệu hợp lệ 0-1000000.
    # [EN] Default cost 40 Emeralds; each material amount must be 0-1000000.
    materials:
      EMERALD: 40
  # [VI] Chi phí lính cấp 10.
  # [EN] Tier 10 hiring costs.
  10:
    # [VI] XP level; mặc định 44, hợp lệ 0-100000.
    # [EN] XP levels; default 44, valid range 0-100000.
    experience-levels: 44
    # [VI] Chi phí mặc định 44 Emerald; số lượng mỗi vật liệu hợp lệ 0-1000000.
