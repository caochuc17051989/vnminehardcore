# ============================================================
# [GRAVE STRUCTURE] CẤU TRÚC MỘ / GRAVE STRUCTURE
# ============================================================
# [VI] Chọn kiểu mộ bằng mini-graves:
#      true  = dùng mộ mini (1x3 block mặt đất)
#      false = dùng mộ full (3x4 block mặt đất)
#      Cả hai cấu trúc đều đặt phần thân dọc theo trục Z, bia ở phía sau.
# [EN] Select the grave style with mini-graves:
#      true  = use the mini grave (1x3 ground footprint)
#      false = use the full grave (3x4 ground footprint)
#      Both structures place the grave body along the Z axis, with the marker at the back.
mini-graves: false

# [VI] Block PLAYER_HEAD tự động nhận skin người chết.
# [EN] PLAYER_HEAD blocks automatically use the deceased player's skin.

# ------------------------------------------------------------
# MỘ FULL / FULL GRAVE
# ------------------------------------------------------------
full:
  dimensions:
    width: 3
    height: 4
    depth: 4

  blocks:
    # Thân mộ trên mặt đất: đất ở giữa, viền đá hai bên.
    - {dx: 1, dy: 0, dz: 0, material: DIRT}
    - {dx: 1, dy: 0, dz: 1, material: DIRT}
    - {dx: 1, dy: 0, dz: 2, material: DIRT}
    - {dx: 0, dy: 0, dz: 0, material: STONE_BRICK_SLAB}
    - {dx: 0, dy: 0, dz: 1, material: STONE_BRICK_SLAB}
    - {dx: 0, dy: 0, dz: 2, material: STONE_BRICK_SLAB}
    - {dx: 2, dy: 0, dz: 0, material: STONE_BRICK_SLAB}
    - {dx: 2, dy: 0, dz: 1, material: STONE_BRICK_SLAB}
    - {dx: 2, dy: 0, dz: 2, material: STONE_BRICK_SLAB}
    - {dx: 1, dy: 1, dz: 1, material: OXEYE_DAISY, data: flower}
    - {dx: 1, dy: 1, dz: 2, material: TORCH}

    # Bia ở cuối thân mộ; đầu người chơi hướng về phía thân mộ.
    - {dx: 0, dy: 0, dz: 3, material: STONE_BRICK_WALL}
    - {dx: 1, dy: 0, dz: 3, material: STONE_BRICK_WALL}
    - {dx: 2, dy: 0, dz: 3, material: STONE_BRICK_WALL}
    - {dx: 0, dy: 1, dz: 3, material: STONE_BRICK_WALL}
    - {dx: 1, dy: 1, dz: 3, material: PLAYER_HEAD, data: player-head}
    - {dx: 2, dy: 1, dz: 3, material: STONE_BRICK_WALL}
    - {dx: 0, dy: 2, dz: 3, material: STONE_BRICK_WALL}
    - {dx: 1, dy: 2, dz: 3, material: STONE_BRICK_WALL}
    - {dx: 2, dy: 2, dz: 3, material: STONE_BRICK_WALL}
    - {dx: 0, dy: 3, dz: 3, material: STONE_BRICK_SLAB}
    - {dx: 1, dy: 3, dz: 3, material: STONE_BRICK_SLAB}
    - {dx: 2, dy: 3, dz: 3, material: STONE_BRICK_SLAB}

# ------------------------------------------------------------
# MỘ MINI / MINI GRAVE
# ------------------------------------------------------------
mini:
  dimensions:
    width: 1
    height: 3
    depth: 3

  blocks:
    # Thân mộ gọn một ô rộng, với hoa và đuốc trang trí.
    - {dx: 0, dy: 0, dz: 0, material: DIRT}
    - {dx: 0, dy: 0, dz: 1, material: DIRT}
    - {dx: 0, dy: 1, dz: 0, material: OXEYE_DAISY, data: flower}
    - {dx: 0, dy: 1, dz: 1, material: TORCH}

    # Bia mộ nhỏ ở cuối thân.
    - {dx: 0, dy: 0, dz: 2, material: STONE_BRICK_WALL}
    - {dx: 0, dy: 1, dz: 2, material: PLAYER_HEAD, data: player-head}
    - {dx: 0, dy: 2, dz: 2, material: STONE_BRICK_SLAB}
