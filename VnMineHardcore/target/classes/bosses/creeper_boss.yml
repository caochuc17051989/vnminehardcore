# ============================================================
# [CREEPER BOSS] 💥 CREEPER BOSS
# ============================================================
boss-id: creeper_boss
enabled: true
entity-type: CREEPER
display-name: "§a§lCreeper Boss"
hp: 200
damage-multiplier: 3.0
chance: 10
# [VI] Thời gian boss tồn tại mặc định sau khi xuất hiện (giây); 1200 = 20 phút.
# [EN] Default boss lifetime after spawning (seconds); 1200 = 20 minutes.
duration-seconds: 1200
warning-seconds: 45
activity-radius: 100 # Max horizontal distance from this boss's spawn location (blocks).

# HP tối đa theo từng level; level không khai báo sẽ dùng mức gần nhất thấp hơn.
# [VI] Giá trị được khai báo đến level 10; runtime giới hạn HP tối đa của boss ở 1024.
# [EN] HP values are provided through level 10; runtime caps boss HP at 1024.
# damage là sát thương cơ sở và tăng theo level; multiply cấu hình số lần/độ mạnh skill.
hp-by-level:
  1: 200
  2: 300
  3: 450
  4: 675
  5: 1012
  6: 1518
  7: 2277
  8: 3416
  9: 5124
  10: 7686
skills:
  charged-explosion:
    # [VI] Bật skill sét tự cường hóa; mặc định true; chỉ true/false.
    # [EN] Enable the self-lightning charge skill; default true; accepts true/false.
    enabled: true
    # [VI] Sát thương lên boss và mục tiêu trong bán kính, nhân theo level; mặc định 12; hợp lệ 0-1024 mỗi level.
    # [EN] Damage to the boss and nearby targets, scaled by level; default 12; valid range 0-1024 per level.
    damage: 12.0
    # [VI] Hệ số số lần tung skill; mặc định 1; hợp lệ 1-40.
    # [EN] Skill cast multiplier; default 1; valid range 1-40.
    multiply: 1
    # [VI] Thời gian hồi skill (giây); mặc định 20; hợp lệ 1-86400.
    # [EN] Skill cooldown (seconds); default 20; valid range 1-86400.
    cooldown-seconds: 20
    # [VI] Bán kính gây sát thương khi gọi sét (block); mặc định 6; hợp lệ 1-64.
    # [EN] Damage radius of the lightning skill (blocks); default 6; valid range 1-64.
    radius: 6.0
    # [VI] Thời gian giữ trạng thái charged (giây); mặc định 5; hợp lệ 1-600.
    # [EN] Duration of the charged state (seconds); default 5; valid range 1-600.
    duration-seconds: 5
    # [VI] Sức mạnh vụ nổ thường; mặc định 3; hợp lệ 1-64.
    # [EN] Normal explosion power; default 3; valid range 1-64.
    explosion-power: 3.0
    # [VI] Sức mạnh vụ nổ khi charged; mặc định 6 và không nhỏ hơn explosion-power; tối đa 64.
    # [EN] Explosion power while charged; default 6 and never below explosion-power; maximum 64.
    charged-explosion-power: 6.0
    # [VI] Thời gian hồi giữa các vụ nổ thường/charged (giây); mặc định 4; hợp lệ 1-120.
    # [EN] Cooldown between normal/charged explosions (seconds); default 4; valid range 1-120.
    explosion-cooldown-seconds: 4
    # [VI] Tốc độ skill (không dùng cho skill creeper); mặc định 1; hợp lệ 0.2-4.
    # [EN] Skill velocity (unused by creeper skill); default 1; valid range 0.2-4.
    velocity: 1.0
    # [VI] Độ tản skill (không dùng cho skill creeper); mặc định 0; hợp lệ 0-π.
    # [EN] Skill spread (unused by creeper skill); default 0; valid range 0-π.
    spread: 0.0

immunities: {}

