name: VnMineHardcore
version: 1.3.4
main: com.vnmine.hardcore.VnMineHardcore
api-version: '1.21'
author: VnMineTeam
description: Hardcore survival plugin with thirst, disasters, combat tag, and configurable gameplay

commands:
  vnstats:
    description: Xem thống kê cá nhân (số lần chết, thời gian sống, quái giết)
    usage: /vnstats
    permission: vnmine.hardcore.stats
  vnhardcore:
    description: Xem trạng thái plugin
    usage: /vnhardcore
    permission: vnmine.hardcore.admin
  vnreload:
    description: Tải lại file cấu hình config.yml
    usage: /vnreload
    permission: vnmine.hardcore.admin
  vnrespawn:
    description: Hồi sinh sau khi chết
    usage: /vnrespawn
  vnleave:
    description: Thoát game sau khi chết
    usage: /vnleave
  fly:
    description: Bật hoặc tắt bay trong chế độ Sinh tồn (admin)
    usage: /fly
    permission: vnmine.hardcore.admin
  nodame:
    description: Bật hoặc tắt miễn sát thương để thử boss (admin)
    usage: /nodame
    permission: vnmine.hardcore.admin
  spawn:
    description: Dịch chuyển về điểm spawn của thế giới (admin)
    usage: /spawn
    permission: vnmine.hardcore.admin
  gm0:
    description: Chuyển sang chế độ Sinh tồn (admin)
    usage: /gm0
    permission: vnmine.hardcore.admin
  gm1:
    description: Chuyển sang chế độ Sáng tạo (admin)
    usage: /gm1
    permission: vnmine.hardcore.admin
  gm2:
    description: Chuyển sang chế độ Phiêu lưu (admin)
    usage: /gm2
    permission: vnmine.hardcore.admin
  gm3:
    description: Chuyển sang chế độ Quan sát (admin)
    usage: /gm3
    permission: vnmine.hardcore.admin
  vnhelp:
    description: Hiển thị hướng dẫn tất cả lệnh
    usage: /vnhelp
    permission: vnmine.hardcore.stats
  vnevent:
    description: Gọi thiên tai thủ công. Gõ /vnevent để xem danh sách sự kiện.
    usage: /vnevent [<id> <warning(s)> <duration(s)>]
    permission: vnmine.hardcore.admin
  vnboss:
    description: Gọi boss thủ công theo level. Nhập ID boss để xem gợi ý hoàn tất.
    usage: /vnboss <id> <level> <warning(s)> <duration(s)>
    permission: vnmine.hardcore.admin
  vn:
    description: Lệnh chính của VnMineHardcore. Gõ /vn help để xem hướng dẫn.
    usage: /vn <subcommand>
    permission: vnmine.hardcore.stats

permissions:
  vnmine.hardcore.stats:
    description: Cho phép xem thống kê
    default: true
  vnmine.hardcore.admin:
    description: Cho phép dùng lệnh admin (status, reload, trigger disaster)
    default: op